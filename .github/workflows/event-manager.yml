name: event-manager

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache-dependency-path: event-manager/go.sum
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make event-manager-lint
      - run: make event-manager-test-race
      - run: make event-manager-test-cover
      - run: docker info
      - run: make event-manager-test-integration
