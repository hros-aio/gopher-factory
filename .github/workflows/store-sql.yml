name: store-sql

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache-dependency-path: store-sql/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: store-sql
      - run: make test-race
      - run: make test-cover
      - run: make test-integration
